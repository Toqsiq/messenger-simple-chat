<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Send a message</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }


        .chat-wrapper {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            height: 80vh;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }


        .messages-list {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #f9f9fa;
        }


        .message-bubble {
            background: #e9e9eb;
            color: #000000;
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 75%;
            align-self: flex-start;
            font-size: 15px;
            line-height: 1.4;
        }


        .form {
            display: flex;
            padding: 12px;
            background: #ffffff;
            border-top: 1px solid #e5e5ea;
            gap: 10px;
            align-items: center;
        }


        .form-input {
            flex: 1;
            border: 1px solid #e5e5ea;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 15px;
            outline: none;
            background: #f4f5f7;
        }

        .form-input:focus {
            border-color: #007AFF;
            background: #ffffff;
        }


        .send-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: transform 0.1s ease;
        }

        .send-btn:active {
            transform: scale(0.9);
        }
    </style>
    <div class="chat-wrapper">

        <div class="messages-list" id="chat-messages">
            <div class="message-bubble">Привет! Это первое тестовое сообщение.</div>
        </div>


        <form class="form" action="/">
            <input class="form-input" name="message-text" placeholder="Введите сообщение" type="text" required>
            <button type="submit" class="send-btn">
                <span class="material-icons">send</span>
            </button>
        </form>
    </div>
    <script>
        const form = document.querySelector('.form');
        const input = document.querySelector('.form-input');
        const messagesList = document.getElementById('chat-messages');


        let savedMessages = JSON.parse(localStorage.getItem('chat-history')) || [];


        function createMessageBubble(text) {
            const newBubble = document.createElement('div');
            newBubble.classList.add('message-bubble');
            newBubble.innerText = text;
            messagesList.appendChild(newBubble);
        }


        function loadHistory() {

            savedMessages.forEach(function (messageText) {
                createMessageBubble(messageText);
            });

            messagesList.scrollTop = messagesList.scrollHeight;
        }


        loadHistory();



        function handleSubmit(event) {
            event.preventDefault();

            const text = input.value.trim();
            if (text === '') return;


            createMessageBubble(text);


            savedMessages.push(text);


            localStorage.setItem('chat-history', JSON.stringify(savedMessages));

            input.value = '';
            messagesList.scrollTop = messagesList.scrollHeight;
        }

        form.addEventListener('submit', handleSubmit);
    </script>
    <script type="text/javascript" src="bundle.js"></script>
</body>

</html>
